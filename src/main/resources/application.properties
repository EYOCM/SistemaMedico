spring.application.name=SistemaMedico
spring.datasource.url=jdbc:postgresql://localhost:5432/hospitaldb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
server.port=8081

# Datos del hospital usados en las notificaciones (RN-GLOBAL-006)
# Se configuran aquí y no en las plantillas, para no tener que tocar el HTML
# cuando cambie el puerto de despliegue o el teléfono de contacto.
app.url-base=http://localhost:8081
app.telefono-contacto=2200-0000
#EL AUSNTO DEBE LLEVAR EL NOMBRE DEL HOSPITAL
app.nombre-hospital=Hospital General

# Correo con Gmail (CU-12). La contraseña es una "contraseña de aplicación" de Google.
# Usuario y contraseña se leen de variables de entorno (Run > Edit Configurations > Environment variables).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=elmersoteyoc@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

