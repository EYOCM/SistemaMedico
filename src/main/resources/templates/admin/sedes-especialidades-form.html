<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar Especialidad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="d-flex">

    <div th:replace="~{fragments/menu :: menu-admin}"></div>

    <main class="flex-grow-1 p-4">
        <h2 class="mb-4">Asignar Especialidad a Sede</h2>

        <div class="card" style="max-width: 640px;">
            <div class="card-body">
                <!-- FB PASOS 5-7 - CU-13 INICIO -->
                <!-- Pasos 5–7 -->
                <form th:action="@{/admin/sedes-especialidades/nueva}" th:object="${asignacion}" method="post" novalidate>
                    <!-- FB PASO 6 - CU-13 INICIO -->
                    <div class="mb-3">
                        <label class="form-label" for="sucursalId">Sede <span class="text-danger">*</span></label>
                        <select class="form-select" id="sucursalId" th:field="*{sucursalId}">
                            <option value="">Seleccione una sede…</option>
                            <option th:each="s : ${sucursales}" th:value="${s.id}" th:text="${s.nombre}">Sede Central</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="especialidadId">Especialidad <span class="text-danger">*</span></label>
                        <select class="form-select" id="especialidadId" th:field="*{especialidadId}">
                            <option value="">Seleccione una especialidad…</option>
                            <option th:each="e : ${especialidades}" th:value="${e.id}" th:text="${e.nombre}">Cardiología</option>
                        </select>
                    </div>
                    <!-- FB PASO 6 - CU-13 FINAL -->
                    <div class="form-text mb-3">La asignación se crea como <strong>Activa</strong>.</div>

                    <div class="d-flex gap-2">
                        <!-- FB PASO 7 - CU-13 INICIO -->
                        <button type="submit" class="btn btn-primary"><i class="fas fa-link me-1"></i>Asignar</button>
                        <!-- FB PASO 7 - CU-13 FINAL -->
                        <!-- FA04 - CU-13 INICIO -->
                        <!-- FA04 -->
                        <a th:href="@{/admin/sedes-especialidades}" class="btn btn-outline-secondary">Cancelar</a>
                        <!-- FA04 - CU-13 FINAL -->
                    </div>

                    <!-- FA03 / FA05 - CU-13 INICIO -->
                    <!-- FA03 y FA05: mensaje global debajo del formulario -->
                    <div th:if="${errorMsg}" class="alert alert-danger mt-3 mb-0">
                        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMsg}"></span>
                    </div>
                    <!-- FA03 / FA05 - CU-13 FINAL -->
                </form>
                <!-- FB PASOS 5-7 - CU-13 FINAL -->
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
