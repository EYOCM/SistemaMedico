<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="d-flex">

    <div th:replace="~{fragments/menu :: menu-admin}"></div>

    <main class="flex-grow-1 p-4">
        <!-- FB PASOS 1-3 - CU-14 INICIO -->
        <div th:replace="~{fragments/catalogo :: encabezado('Medicamentos', '/admin/medicamentos')}"></div>
        <!-- FB PASOS 1-3 - CU-14 FINAL -->
        <!-- FB PASO 8 - CU-14 INICIO -->
        <th:block th:replace="~{fragments/catalogo :: alertas}"></th:block>
        <!-- FB PASO 8 - CU-14 FINAL -->
        <!-- FB PASO 2 - CU-14 INICIO -->
        <div th:replace="~{fragments/catalogo :: filtro('/admin/medicamentos')}"></div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle bg-white">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Unidad</th>
                    <th>Precio</th>
                    <th>Stock mínimo</th>
                    <th>Estado</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${registros.content}">
                    <td th:text="${r.id}">1</td>
                    <td><span th:text="${r.nombre}">—</span> <span th:if="${r.controlado}" class="badge bg-warning text-dark ms-1"><i class="fas fa-shield-halved me-1"></i>Controlado</span></td>
                    <td th:text="${r.unidad}">—</td>
                    <td th:text="'Q' + ${#numbers.formatDecimal(r.precio, 1, 'COMMA', 2, 'POINT')}">Q0.00</td>
                    <td th:text="${r.stockMinimo}">—</td>
                    <td><th:block th:replace="~{fragments/catalogo :: estado(${r.activo})}"></th:block></td>
                    <td class="text-center">
                        <div th:replace="~{fragments/catalogo :: acciones('/admin/medicamentos', ${r.id}, ${r.nombre}, ${r.activo})}"></div>
                    </td>
                </tr>
                <!-- FA01 - CU-14 INICIO -->
                <th:block th:if="${registros.content.isEmpty()}"><tr th:replace="~{fragments/catalogo :: sinResultados(7)}"></tr></th:block>
                <!-- FA01 - CU-14 FINAL -->
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/catalogo :: paginacion('/admin/medicamentos')}"></div>
        <!-- FB PASO 2 - CU-14 FINAL -->
    </main>
</div>

<!-- FA03 - CU-14 INICIO -->
<th:block th:replace="~{fragments/catalogo :: modalEliminar}"></th:block>
<!-- FA03 - CU-14 FINAL -->
</body>
</html>
