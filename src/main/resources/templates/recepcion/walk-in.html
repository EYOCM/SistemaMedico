<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Cita (Walk-in)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/recepcion}"><i class="fas fa-hospital me-2"></i>Recepción</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">
                <i class="fas fa-right-from-bracket me-1"></i>Cerrar sesión
            </button>
        </form>
    </div>
</nav>

<!-- FA04 / FA06 - CU-05 INICIO -->
<div class="container mb-5" style="max-width: 720px;">

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-circle-exclamation me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="mb-3"><i class="fas fa-calendar-plus me-2"></i>Nueva Cita (Walk-in)</h5>

            <div class="alert alert-success py-2">
                <i class="fas fa-user me-2"></i>
                Paciente: <strong th:text="${prep.nombrePaciente}">Pedro Sánchez Mora</strong>
                · DPI <span th:text="${prep.dpi}">3003000000102</span>
            </div>

            <form th:action="@{/recepcion/walk-in}" th:object="${walkIn}" method="post" id="formWalkIn">
                <input type="hidden" th:field="*{dpi}">

                <div class="mb-3">
                    <label for="sucursalId" class="form-label">Sede</label>
                    <select th:field="*{sucursalId}" class="form-select" required>
                        <option value="">Seleccione una sede</option>
                        <option th:each="s : ${sucursales}" th:value="${s.id}" th:text="${s.nombre}">Sede Central</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="especialidadId" class="form-label">Especialidad</label>
                    <select id="especialidadId" name="especialidadId" class="form-select" required disabled>
                        <option value="">Seleccione primero la sede</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="medicoId" class="form-label">Médico</label>
                    <select id="medicoId" name="medicoId" class="form-select" required disabled>
                        <option value="">Seleccione primero la especialidad</option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fecha" class="form-label">Fecha</label>
                        <input type="date" th:field="*{fecha}" class="form-control" th:min="${hoy}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="hora" class="form-label">Hora</label>
                        <select id="hora" name="hora" class="form-select" required disabled>
                            <option value="">Seleccione primero el médico</option>
                        </select>
                    </div>
                </div>
                <div id="sinHorarios" class="alert alert-warning py-2 small d-none">
                    No hay horarios disponibles para el médico seleccionado en esa fecha. Elija otro día.
                </div>

                <div class="mb-3">
                    <label for="motivo" class="form-label">Motivo de la consulta</label>
                    <textarea th:field="*{motivo}" class="form-control" rows="3" maxlength="2000"
                              placeholder="Entre 10 y 2000 caracteres"></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/recepcion/buscar(tipo='dpi', valor=${prep.dpi})}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-calendar-check me-1"></i>Agendar cita
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- FA04 / FA06 - CU-05 FINAL -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/recepcion-selectores.js}"></script>
<!-- FA04 / FA06 - CU-05 INICIO -->
<script th:inline="javascript">
    (function () {
        const URL_ESPECIALIDADES = /*[[@{/recepcion/walk-in/especialidades}]]*/ '/especialidades';
        const URL_MEDICOS = /*[[@{/recepcion/walk-in/medicos}]]*/ '/medicos';
        const URL_HORARIOS = /*[[@{/recepcion/walk-in/horarios}]]*/ '/horarios';
        const elegido = {
            especialidad: /*[[${walkIn.especialidadId}]]*/ null,
            medico: /*[[${walkIn.medicoId}]]*/ null,
            hora: /*[[${walkIn.hora}]]*/ null
        };

        const sucursal = document.getElementById('sucursalId');
        const especialidad = document.getElementById('especialidadId');
        const medico = document.getElementById('medicoId');
        const fecha = document.getElementById('fecha');
        const hora = document.getElementById('hora');
        const sinHorarios = document.getElementById('sinHorarios');

        const { vaciar, llenar, pedir } = Selectores;

        function cargarEspecialidades(seleccionado) {
            vaciar(medico, 'Seleccione primero la especialidad');
            vaciar(hora, 'Seleccione primero el médico');
            sinHorarios.classList.add('d-none');
            if (!sucursal.value) {
                vaciar(especialidad, 'Seleccione primero la sede');
                return Promise.resolve();
            }
            return pedir(URL_ESPECIALIDADES, { sucursalId: sucursal.value })
                .then(lista => llenar(especialidad, lista, 'Seleccione una especialidad', seleccionado));
        }

        function cargarMedicos(seleccionado) {
            vaciar(hora, 'Seleccione primero el médico');
            sinHorarios.classList.add('d-none');
            if (!especialidad.value) {
                vaciar(medico, 'Seleccione primero la especialidad');
                return Promise.resolve();
            }
            return pedir(URL_MEDICOS, { sucursalId: sucursal.value, especialidadId: especialidad.value })
                .then(lista => llenar(medico, lista, 'Seleccione un médico', seleccionado));
        }

        function cargarHorarios(seleccionado) {
            sinHorarios.classList.add('d-none');
            if (!medico.value || !fecha.value) {
                vaciar(hora, 'Seleccione primero el médico');
                return Promise.resolve();
            }
            return pedir(URL_HORARIOS, { medicoId: medico.value, fecha: fecha.value })
                .then(lista => {
                    llenar(hora, lista, 'Seleccione una hora', seleccionado);
                    sinHorarios.classList.toggle('d-none', lista.length > 0);
                });
        }

        sucursal.addEventListener('change', () => cargarEspecialidades(null));
        especialidad.addEventListener('change', () => cargarMedicos(null));
        medico.addEventListener('change', () => cargarHorarios(null));
        fecha.addEventListener('change', () => cargarHorarios(null));

        // Al abrir (o al volver con un error), se recupera lo que ya estaba elegido
        cargarEspecialidades(elegido.especialidad)
            .then(() => cargarMedicos(elegido.medico))
            .then(() => cargarHorarios(elegido.hora));
    })();
</script>
<!-- FA04 / FA06 - CU-05 FINAL -->
</body>
</html>
