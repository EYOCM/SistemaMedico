<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergencia sin cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/recepcion}"><i class="fas fa-hospital me-2"></i>Recepción</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">
                <i class="fas fa-right-from-bracket me-1"></i>Cerrar sesión
            </button>
        </form>
    </div>
</nav>

<!-- FA01 - CU-05 INICIO -->
<div class="container mb-5" style="max-width: 720px;">

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-circle-exclamation me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
            <i class="fas fa-truck-medical me-2"></i>Paciente de emergencia (sin cita)
        </div>
        <div class="card-body">
            <p class="text-muted small mb-3">
                Sede: <strong th:text="${sede.nombre}">Sede Central - Zona 1</strong>.
                El paciente queda como <strong>presente</strong> con prioridad de <strong>EMERGENCIA</strong>
                y pasa directamente a toma de signos vitales.
            </p>

            <form th:action="@{/recepcion/emergencia}" th:object="${emergencia}" method="post">
                <div class="mb-3">
                    <label for="dpi" class="form-label">DPI del paciente</label>
                    <input type="text" th:field="*{dpi}" class="form-control" maxlength="13" required
                           placeholder="13 dígitos" autocomplete="off">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" maxlength="100">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="apellidos" class="form-label">Apellidos</label>
                        <input type="text" th:field="*{apellidos}" class="form-control" maxlength="100">
                    </div>
                    <div class="form-text mt-n2 mb-3">Solo si el paciente no está registrado: se crea su registro con estos datos.</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="especialidadId" class="form-label">Especialidad (triaje)</label>
                        <select id="especialidadId" name="especialidadId" class="form-select" required disabled>
                            <option value="">Cargando…</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="medicoId" class="form-label">Médico</label>
                        <select id="medicoId" name="medicoId" class="form-select" required disabled>
                            <option value="">Seleccione primero la especialidad</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="motivo" class="form-label">Motivo / observaciones del triaje</label>
                    <textarea th:field="*{motivo}" class="form-control" rows="3" maxlength="2000"
                              placeholder="Entre 10 y 2000 caracteres"></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/recepcion}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-truck-medical me-1"></i>Registrar emergencia
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- FA01 - CU-05 FINAL -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/recepcion-selectores.js}"></script>
<!-- FA01 - CU-05 INICIO -->
<script th:inline="javascript">
    (function () {
        const URL_ESPECIALIDADES = /*[[@{/recepcion/walk-in/especialidades}]]*/ '/especialidades';
        const URL_MEDICOS = /*[[@{/recepcion/walk-in/medicos}]]*/ '/medicos';
        const sedeId = /*[[${sede.id}]]*/ 1;
        const elegido = {
            especialidad: /*[[${emergencia.especialidadId}]]*/ null,
            medico: /*[[${emergencia.medicoId}]]*/ null
        };
        const { vaciar, llenar, pedir } = Selectores;
        const especialidad = document.getElementById('especialidadId');
        const medico = document.getElementById('medicoId');

        function cargarMedicos(seleccionado) {
            if (!especialidad.value) {
                vaciar(medico, 'Seleccione primero la especialidad');
                return Promise.resolve();
            }
            return pedir(URL_MEDICOS, { sucursalId: sedeId, especialidadId: especialidad.value })
                .then(lista => llenar(medico, lista, 'Seleccione un médico', seleccionado));
        }

        especialidad.addEventListener('change', () => cargarMedicos(null));

        pedir(URL_ESPECIALIDADES, { sucursalId: sedeId })
            .then(lista => llenar(especialidad, lista, 'Seleccione una especialidad', elegido.especialidad))
            .then(() => cargarMedicos(elegido.medico));
    })();
</script>
<!-- FA01 - CU-05 FINAL -->
</body>
</html>
