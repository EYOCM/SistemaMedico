<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órdenes de laboratorio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .dato { color: var(--muted-text); }
        .fila-orden { cursor: pointer; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/laboratorio}"><i class="fas fa-flask me-2"></i>Laboratorio</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">
                <i class="fas fa-right-from-bracket me-1"></i>Cerrar sesión
            </button>
        </form>
    </div>
</nav>

<div class="container mb-5">

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-circle-exclamation me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
        <div>
            <h4 class="mb-0">Órdenes de laboratorio</h4>
            <div class="dato small">Seleccione una orden para ver sus exámenes y registrar resultados.</div>
        </div>
        <span class="dato small"><span th:text="${#lists.size(ordenes)}">0</span> orden(es)</span>
    </div>

    <!-- FB PASO 1 - CU-09 INICIO -->
    <!-- Paso 1: filtros por estado, paciente y médico -->
    <form th:action="@{/laboratorio}" method="get" class="card card-body shadow-sm mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small mb-1" for="estado">Estado</label>
                <select class="form-select" id="estado" name="estado">
                    <option value="">Todos</option>
                    <option th:each="e : ${estados}" th:value="${e.name()}" th:text="${e.descripcion}"
                            th:selected="${estado == e.name()}">Pendiente</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label small mb-1" for="paciente">Paciente (nombre o DPI)</label>
                <input type="text" class="form-control" id="paciente" name="paciente" th:value="${paciente}" placeholder="Ana / 3003000000101">
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1" for="medico">Médico</label>
                <input type="text" class="form-control" id="medico" name="medico" th:value="${medico}" placeholder="Méndez">
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-grow-1"><i class="fas fa-filter me-1"></i>Filtrar</button>
                <a th:href="@{/laboratorio}" class="btn btn-outline-secondary" title="Quitar filtros"><i class="fas fa-xmark"></i></a>
            </div>
        </div>
    </form>
    <!-- FB PASO 1 - CU-09 FINAL -->

    <!-- FB PASOS 1-2 - CU-09 INICIO -->
    <div th:if="${#lists.isEmpty(ordenes)}" class="card card-body text-center dato">No hay órdenes con esos filtros.</div>

    <div class="table-responsive card shadow-sm" th:unless="${#lists.isEmpty(ordenes)}">
        <table class="table table-hover align-middle mb-0">
            <thead class="small dato">
            <tr><th>Orden</th><th>Paciente</th><th>Médico</th><th>Fecha</th><th>Exámenes</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="o : ${ordenes}" class="fila-orden" th:attr="data-href=@{/laboratorio/ordenes/{id}(id=${o.id})}">
                <td>
                    <span class="fw-semibold" th:text="${o.numeroOrden}">LAB-…</span>
                    <!-- FA01 - CU-09 INICIO -->
                    <span th:if="${o.externa}" class="badge bg-warning text-dark ms-1">Externa</span>
                    <!-- FA01 - CU-09 FINAL -->
                </td>
                <td>
                    <div th:text="${o.nombrePaciente}">Ana Gómez</div>
                    <div class="small dato" th:text="${o.dpi}">3003000000101</div>
                </td>
                <td th:text="'Dr(a). ' + ${o.nombreMedico}">Dr. Méndez</td>
                <td class="small" th:text="${#temporals.format(o.fechaCreacion, 'dd/MM/yyyy HH:mm')}">15/10/2026</td>
                <td class="small"><span th:text="${o.publicados}">0</span> / <span th:text="${o.cantidadExamenes}">3</span> publicados</td>
                <td>
                    <span class="badge"
                          th:classappend="${o.estado == 'PENDIENTE'} ? 'bg-secondary' : (${o.estado == 'EN_PROCESO'} ? 'bg-primary' : 'bg-success')"
                          th:text="${o.estadoDescripcion}">Pendiente</span>
                </td>
                <td class="text-end">
                    <a th:href="@{/laboratorio/ordenes/{id}(id=${o.id})}" class="btn btn-outline-primary btn-sm">Ver</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <!-- FB PASOS 1-2 - CU-09 FINAL -->
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- FB PASO 2 - CU-09 INICIO -->
<script>
    // Paso 2: toda la fila abre el detalle
    document.querySelectorAll('.fila-orden').forEach(f => f.addEventListener('click', e => {
        if (e.target.closest('a')) return;
        window.location.href = f.dataset.href;
    }));
</script>
<!-- FB PASO 2 - CU-09 FINAL -->
</body>
</html>
