<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Paso 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container mt-5 mb-5" style="max-width: 600px;">
    <h3 class="mb-3 text-center">Agendar Cita Médica</h3>
    <div class="progress mb-4" style="height: 10px;">
        <div class="progress-bar bg-primary" role="progressbar" style="width: 80%"></div>
    </div>
    <h5 class="text-center mb-4">Paso 4 de 5: Fecha y Hora</h5>

    <!-- FA02 / FA03 - CU-03 INICIO -->
    <div th:if="${error}" class="alert alert-warning" th:text="${error}"></div>
    <!-- FA02 / FA03 - CU-03 FINAL -->

    <!--
        La FECHA va en su propio formulario GET: al cambiarla, la página se
        recarga y el servidor devuelve los horarios REALES de ese día.
        Antes las horas eran siempre las de mañana, sin importar la fecha.
    -->
    <!-- FB PASO 5 - CU-03 INICIO -->
    <form method="get" th:action="@{/citas/paso/4}" class="card p-4 shadow-sm mb-3">
        <label for="fecha" class="form-label fw-bold">Fecha de la Cita</label>
        <input type="date" class="form-control" id="fecha" name="fecha"
               th:value="${fecha}" th:min="${hoy}" required
               onchange="this.form.submit()">
        <div class="form-text">Al cambiar la fecha se actualizan los horarios disponibles.</div>
    </form>

    <form th:action="@{/citas/paso/4}" method="post" class="card p-4 shadow-sm">
        <!-- La fecha elegida viaja oculta junto con la hora -->
        <input type="hidden" name="fecha" th:value="${fecha}">

        <div class="mb-3">
            <label for="hora" class="form-label fw-bold">Hora Disponible</label>
            <select class="form-select" id="hora" name="hora" required
                    th:disabled="${#lists.isEmpty(horarios)}">
                <option value="">-- Seleccione un horario --</option>
                <option th:each="h : ${horarios}" th:value="${h}" th:text="${h}"></option>
            </select>
            <div class="form-text" th:if="${#lists.isEmpty(horarios)}">
                No quedan espacios libres ese día. Elija otra fecha arriba.
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <!-- FA04 - CU-03 INICIO -->
            <a th:href="@{/citas/volver/3}" class="btn btn-outline-secondary">Volver</a>
            <!-- FA04 - CU-03 FINAL -->
            <button type="submit" class="btn btn-primary"
                    th:disabled="${#lists.isEmpty(horarios)}">Siguiente</button>
        </div>
    </form>
    <!-- FB PASO 5 - CU-03 FINAL -->
</div>
</body>
</html>
