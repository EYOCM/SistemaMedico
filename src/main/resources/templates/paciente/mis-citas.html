<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        body { background-color: #f0f2f5; }
        .cita-card { border-left: 6px solid #adb5bd; }
        .estado-PENDIENTE_PAGO { border-left-color: #f0ad4e; }
        .estado-PAGADA { border-left-color: #198754; }
        .estado-CANCELADA, .estado-NO_ASISTIO { border-left-color: #dc3545; }
        .estado-ATENCION_FINALIZADA { border-left-color: #6c757d; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/paciente/dashboard}"><i class="fas fa-hospital me-2"></i>Mi Portal</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">
                <i class="fas fa-right-from-bracket me-1"></i>Cerrar sesión
            </button>
        </form>
    </div>
</nav>

<div class="container mb-5" style="max-width: 820px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="fas fa-calendar-check me-2"></i>Mis Citas</h4>
        <a th:href="@{/citas/paso/1}" class="btn btn-primary btn-sm">
            <i class="fas fa-calendar-plus me-1"></i>Agendar Cita
        </a>
    </div>

    <div th:if="${#lists.isEmpty(citas)}" class="alert alert-info">
        <i class="fas fa-circle-info me-2"></i>Todavía no tiene citas registradas.
    </div>

    <div th:each="c : ${citas}" class="card shadow-sm mb-3 cita-card" th:classappend="'estado-' + ${c.estado}">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                    <h6 class="mb-0" th:text="${c.nombreEspecialidad}">Medicina General</h6>
                    <small class="text-muted" th:text="${c.numeroCita}">CITA-20261018-1234</small>
                    <span th:if="${c.tipoSeguimiento != null}" class="badge bg-info text-dark ms-1">Seguimiento</span>
                </div>
                <span class="badge bg-secondary" th:text="${c.estadoDescripcion}">Pagada</span>
            </div>
            <div class="small">
                <div><i class="fas fa-user-doctor me-2 text-muted"></i><span th:text="${c.nombreMedico}">Dr.</span></div>
                <div><i class="fas fa-building me-2 text-muted"></i><span th:text="${c.nombreSucursal}">Sede</span></div>
                <div><i class="fas fa-clock me-2 text-muted"></i><span th:text="${#temporals.format(c.fechaHora, 'dd/MM/yyyy HH:mm')}">18/10/2026 10:00</span></div>
            </div>

            <!-- Se puede pagar si sigue pendiente y la reserva no venció (o no vence) -->
            <div th:if="${c.estado == 'PENDIENTE_PAGO'}" class="mt-2">
                <a th:if="${c.reservaSinVencimiento or c.segundosRestantes > 0}"
                   th:href="@{/pago/{id}(id=${c.id})}" class="btn btn-success btn-sm">
                    <i class="fas fa-credit-card me-1"></i>Pagar en línea
                </a>
                <span th:unless="${c.reservaSinVencimiento or c.segundosRestantes > 0}" class="text-danger small">
                    <i class="fas fa-hourglass-end me-1"></i>La reserva venció y el horario fue liberado.
                </span>
            </div>
            <div th:if="${c.estado == 'PAGADA'}" class="mt-2">
                <a th:href="@{/pago/{id}/exito(id=${c.id})}" class="btn btn-outline-primary btn-sm">
                    <i class="fas fa-receipt me-1"></i>Ver comprobante
                </a>
            </div>
        </div>
    </div>

    <a th:href="@{/paciente/dashboard}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i>Volver al Portal
    </a>
</div>
</body>
</html>
