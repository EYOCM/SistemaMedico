<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .receta-card { border-left: 6px solid #198754; }
        .receta-card.vencida { border-left-color: #dc3545; }
        .dato th { font-weight: 400; color: var(--muted-text); width: 38%; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/farmacia}"><i class="fas fa-prescription-bottle-medical me-2"></i>Farmacia</a>
        <a class="btn btn-outline-light btn-sm ms-auto me-2" th:href="@{/inventario}"><i class="fas fa-boxes-stacked me-1"></i>Inventario</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">
                <i class="fas fa-right-from-bracket me-1"></i>Cerrar sesión
            </button>
        </form>
    </div>
</nav>

<div class="container mb-5" style="max-width: 820px;">

    <!-- FA03 - CU-11 INICIO -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-circle-check me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <!-- FA03 - CU-11 FINAL -->
    <!-- FB PASO 4 - CU-11 INICIO -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-circle-exclamation me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <!-- FB PASO 4 - CU-11 FINAL -->

    <!-- FB PASOS 1-2 - CU-11 INICIO -->
    <!-- Pasos 1–2: Nuevo despacho, buscar receta -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="mb-1"><i class="fas fa-magnifying-glass me-2"></i>Nuevo despacho</h5>
            <p class="text-muted small mb-3">Solo se muestran recetas pendientes de despacho. Vigencia: 7 días desde su emisión.</p>
            <form th:action="@{/farmacia/buscar}" method="get">
                <div class="btn-group mb-3" role="group">
                    <input type="radio" class="btn-check" name="tipo" id="tipoReceta" value="receta"
                           th:checked="${tipo == null or tipo == 'receta'}">
                    <label class="btn btn-outline-primary" for="tipoReceta">Por No. Receta</label>
                    <input type="radio" class="btn-check" name="tipo" id="tipoConsulta" value="consulta"
                           th:checked="${tipo == 'consulta'}">
                    <label class="btn btn-outline-primary" for="tipoConsulta">Por No. Consulta (cita)</label>
                </div>
                <div class="input-group">
                    <input type="text" name="valor" id="valor" class="form-control form-control-lg"
                           th:value="${valor}" autocomplete="off" autofocus placeholder="Ej. REC-20261015-1234">
                    <button type="submit" class="btn btn-primary px-4">Buscar</button>
                </div>
            </form>
        </div>
    </div>
    <!-- FB PASOS 1-2 - CU-11 FINAL -->

    <div th:if="${aviso}" class="alert alert-warning">
        <i class="fas fa-circle-info me-2"></i><span th:text="${aviso}"></span>
    </div>

    <!-- FB PASOS 2-3 - CU-11 INICIO -->
    <div th:each="r : ${recetas}" class="card shadow-sm mb-3 receta-card" th:classappend="${!r.vigente} ? 'vencida'">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                    <h5 class="mb-0" th:text="${r.nombrePaciente}">Ana Gómez</h5>
                    <small class="text-muted" th:text="${r.numeroReceta}">REC-…</small>
                </div>
                <span th:if="${r.vigente}" class="badge bg-success"
                      th:text="'Vigente · ' + ${r.diasTranscurridos} + ' día(s)'">Vigente</span>
                <span th:unless="${r.vigente}" class="badge bg-danger"
                      th:text="'Vencida · ' + ${r.diasTranscurridos} + ' días'">Vencida</span>
            </div>
            <table class="table table-sm table-borderless dato mb-2">
                <tr><th>Consulta (cita)</th><td th:text="${r.numeroCita}">CITA-…</td></tr>
                <tr><th>Médico</th><td th:text="'Dr(a). ' + ${r.nombreMedico}">Dr.</td></tr>
                <tr><th>Fecha de emisión</th><td th:text="${#temporals.format(r.fechaEmision, 'dd/MM/yyyy HH:mm')}">fecha</td></tr>
                <tr><th>Medicamentos</th><td th:text="${r.cantidadMedicamentos}">2</td></tr>
            </table>
            <div class="d-flex gap-2 flex-wrap">
                <!-- FB PASO 3 - CU-11 INICIO -->
                <!-- Paso 3: las vencidas tienen el botón deshabilitado -->
                <a th:if="${r.vigente}" th:href="@{/farmacia/recetas/{id}/despacho(id=${r.id})}" class="btn btn-success">
                    <i class="fas fa-box-open me-1"></i>Despachar
                </a>
                <button th:unless="${r.vigente}" type="button" class="btn btn-success" disabled>
                    <i class="fas fa-box-open me-1"></i>Despachar
                </button>
                <!-- FB PASO 3 - CU-11 FINAL -->
                <!-- FA03 - CU-11 INICIO -->
                <!-- FA03 -->
                <form method="post" th:action="@{/farmacia/recetas/{id}/no-adquirido(id=${r.id})}" class="m-0 form-no-adquirido">
                    <button type="submit" class="btn btn-outline-secondary">
                        <i class="fas fa-ban me-1"></i>Paciente no desea adquirirlos
                    </button>
                </form>
                <!-- FA03 - CU-11 FINAL -->
            </div>
        </div>
    </div>
    <!-- FB PASOS 2-3 - CU-11 FINAL -->
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        const valor = document.getElementById('valor');
        const ejemplos = { receta: 'Ej. REC-20261015-1234', consulta: 'Ej. CITA-20261015-1234' };
        document.querySelectorAll('input[name="tipo"]').forEach(r => {
            r.addEventListener('change', () => { valor.placeholder = ejemplos[r.value]; valor.focus(); });
            if (r.checked) valor.placeholder = ejemplos[r.value];
        });
        // FA03 - CU-11 INICIO
        document.querySelectorAll('.form-no-adquirido').forEach(f => f.addEventListener('submit', e => {
            if (!window.confirm('¿Registrar que el paciente no adquirió los medicamentos? La receta quedará cerrada.')) e.preventDefault();
        }));
        // FA03 - CU-11 FINAL
    })();
</script>
</body>
</html>
